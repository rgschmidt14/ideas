<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Map Easy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>TTRPG Map Easy</h1>

        <div class="main-layout">
            <div class="left-panel">
                <div class="controls session-controls">
                    <h3>Sessions</h3>
                    <select id="session-select"></select>
                    <div class="session-buttons">
                        <button id="load-session-btn">Load</button>
                        <button id="update-session-btn" title="Overwrite the selected session with the current map state.">Update Selected</button>
                        <button id="delete-session-btn">Delete</button>
                    </div>
                    <hr>
                    <input type="text" id="session-name-input" placeholder="New Session Name">
                    <button id="save-session-btn">Save As New</button>
                    <button id="new-session-btn">New Blank</button>
                </div>
                <div class="controls">
                    <h3>1. Load Background Image</h3>
                    <input type="file" id="bg-image-input" accept="image/*">
                </div>
                 <div class="controls">
                    <h3>Grid & View</h3>
                    <div class="grid-controls-container">
                        <label for="grid-opacity-slider">Grid Opacity:</label>
                        <input type="range" id="grid-opacity-slider" min="0" max="1" step="0.05" value="0.5">
                        <span id="grid-opacity-value">0.5</span>
                    </div>
                    <div class="grid-controls-container">
                        <label for="grid-lock-toggle">Lock Grid:</label>
                        <input type="checkbox" id="grid-lock-toggle">
                    </div>
                 </div>
                 <div class="controls">
                    <h3>2. Map Dimensions</h3>
                    <label for="map-width">Width:</label>
                    <input type="number" id="map-width" value="30">
                    <label for="map-length">Depth:</label>
                    <input type="number" id="map-length" value="20">
                    <select id="map-units">
                        <option value="ft">ft</option>
                        <option value="yd">yd</option>
                        <option value="m">m</option>
                    </select>
                    <br>
                    <label for="map-increment">Grid Increment:</label>
                    <input type="number" id="map-increment" value="5" min="1">
                </div>
                 <div class="controls" id="token-controls">
                    <h3 id="token-mode-header">3. Add Token</h3>
                    <div>
                        <label for="token-image-input">Token Image:</label>
                        <input type="file" id="token-image-input" accept="image/*">
                        <img id="token-preview" src="" alt="Token Preview" style="display: none;"/>
                    </div>
                    <div class="token-dims">
                        <label>Size (W, L, H):</label>
                        <input type="number" id="token-width" value="1" min="1">
                        <input type="number" id="token-length" value="1" min="1">
                        <input type="number" id="token-height" value="1" min="0">
                        <span id="token-units">ft</span>
                    </div>
                    <div id="token-buttons">
                       <button id="add-token-btn">Add to Library</button>
                       <button id="update-token-btn" style="display: none;">Update Token</button>
                       <button id="cancel-edit-btn" style="display: none;">Cancel</button>
                    </div>
                </div>
                 <div id="selected-token-controls" class="controls" style="display: none;">
                    <h4>Selected Token</h4>
                    <label for="token-altitude">Elevation:</label>
                    <input type="range" id="token-altitude" min="-100" max="100" value="0">
                    <span id="altitude-value">0</span>
                </div>
                <div id="on-map-token-list" class="controls">
                    <h4>Tokens on Map</h4>
                    <!-- Token list will be populated by JS -->
                </div>
            </div>
            <div class="right-panel">
                <div id="map-container">
                    <div id="map-ui-overlay">
                        <button id="hamburger-btn" class="map-ui-btn">☰</button>
                        <button id="fullscreen-btn" class="map-ui-btn">⛶</button>
                    </div>
                    <canvas id="grid-canvas"></canvas>
                    <div class="handle" id="handle-tl"></div>
                    <div class="handle" id="handle-tr"></div>
                </div>
                <div id="token-library">
                    <h4>Token Library (Drag to Map)</h4>
                    <!-- Tokens will be added here by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
